spring:
  application:
    name: cmdb-data-process
  datasource:
    url: jdbc:mysql://localhost:8889/switchDB
    username: ${DB_USER_NAME:root}
    password: ${DB_USER_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081



